<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Admin Login | THE GAME WITH FUN</title>
  <meta name="description" content="Secure administrative access portal for THE GAME WITH FUN management system.">

  <style>
    /* ==========================================================================
       ADMIN LOGIN ULTRA-PREMIUM CYBER/DARK DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-base: #06080d;
      --bg-surface: #0a0e17;
      --bg-card: rgba(14, 19, 32, 0.85);
      --bg-input: rgba(255, 255, 255, 0.04);
      --bg-input-focus: rgba(255, 255, 255, 0.08);

      --gold-primary: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --gold-gradient: linear-gradient(135deg, #fbbf24 0%, #f59e0b 55%, #d97706 100%);

      --cyan-neon: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.35);

      --ruby-neon: #f43f5e;
      --emerald-neon: #10b981;

      --text-white: #ffffff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-glow: rgba(245, 158, 11, 0.35);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;

      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --smooth-ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-base);
      font-family: var(--font-stack);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem;
      position: relative;
      background-image:
        radial-gradient(circle at 10% 15%, rgba(245, 158, 11, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
      background-attachment: fixed;
    }

    /* Ambient cyber grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Branding Header */
    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-badge {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(0, 240, 255, 0.2));
      border: 1px solid var(--gold-glow);
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      color: var(--gold-primary);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
      margin-bottom: 1rem;
      position: relative;
    }

    .brand-logo-badge::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      animation: spinDashed 18s linear infinite;
    }

    @keyframes spinDashed {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
      margin-top: 4px;
    }

    /* Login Card */
    .login-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.4rem 1.85rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(245, 158, 11, 0.1);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      position: relative;
      overflow: hidden;
    }

    .login-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), var(--cyan-neon), transparent);
    }

    .card-title {
      font-size: 1.65rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 0.35rem;
    }

    .card-subtitle {
      font-size: 0.86rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    /* Notification Banner */
    .alert-banner {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 1.35rem;
      animation: smoothSlide 0.25s var(--smooth-ease) forwards;
    }

    .alert-banner.danger {
      display: flex;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    @keyframes smoothSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.3rem;
    }

    .field-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .field-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all 0.25s var(--smooth-ease);
    }

    .field-wrap:hover {
      background: var(--bg-input-focus);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .field-wrap:focus-within {
      background: var(--bg-input-focus);
      border-color: var(--gold-primary);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
    }

    .field-icon {
      padding-left: 1.1rem;
      color: var(--text-dim);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: color 0.25s ease;
    }

    .field-wrap:focus-within .field-icon {
      color: var(--gold-primary);
    }

    .field-control {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      padding: 0.95rem 1rem;
      color: var(--text-white);
      font-size: 0.96rem;
      font-weight: 600;
    }

    .field-control::placeholder {
      color: #475569;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .btn-toggle-eye {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0 1.1rem;
      color: var(--text-dim);
      display: grid;
      place-items: center;
      transition: color 0.2s ease;
    }

    .btn-toggle-eye:hover {
      color: #fff;
    }

    /* Submit Button */
    .btn-submit-admin {
      width: 100%;
      padding: 1rem;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.75px;
      background: var(--gold-gradient);
      color: #04060a;
      border: none;
      cursor: pointer;
      transition: all 0.3s var(--smooth-ease);
      box-shadow: 0 6px 24px var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .btn-submit-admin:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.6);
      filter: brightness(1.08);
    }

    .btn-submit-admin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(0, 0, 0, 0.25);
      border-top-color: #04060a;
      border-radius: 50%;
      animation: spinCircle 0.65s linear infinite;
    }

    .btn-submit-admin.loading .btn-spinner {
      display: inline-block;
    }

    .btn-submit-admin.loading .btn-text {
      display: none;
    }

    @keyframes spinCircle {
      to { transform: rotate(360deg); }
    }

    /* Card Footer */
    .card-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .card-footer a {
      color: var(--cyan-neon);
      font-weight: 800;
      text-decoration: none;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Header Branding -->
    <header class="brand-header">
      <div class="brand-logo-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="6"></rect>
          <line x1="6" y1="12" x2="10" y2="12"></line>
          <line x1="8" y1="10" x2="8" y2="14"></line>
          <circle cx="15" cy="12" r="1" fill="currentColor"></circle>
          <circle cx="18" cy="10" r="1" fill="currentColor"></circle>
        </svg>
      </div>
      <h1 class="brand-title">THE GAME WITH FUN</h1>
      <div class="brand-subtitle">ADMIN CONTROL PANEL</div>
    </header>

    <!-- Main Card -->
    <main class="login-card">
      <h2 class="card-title">Admin Login</h2>
      <p class="card-subtitle">Enter your authorized credentials to access system management.</p>

      <!-- Error Alert -->
      <div id="alertBox" class="alert-banner" role="alert" aria-live="assertive">
        <span id="alertMsg">Authentication error</span>
      </div>

      <form id="adminLoginForm" novalidate>
        <!-- Admin ID Field -->
        <div class="form-group">
          <label for="adminIdInput" class="field-label">Admin ID</label>
          <div class="field-wrap">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <input 
              type="text" 
              id="adminIdInput" 
              class="field-control" 
              placeholder="0131050428" 
              autocomplete="username" 
              required 
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPasswordInput" class="field-label">Password</label>
          <div class="field-wrap">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <input 
              type="password" 
              id="adminPasswordInput" 
              class="field-control" 
              placeholder="••••••••" 
              autocomplete="current-password" 
              required 
            />
            <button type="button" id="btnToggleEye" class="btn-toggle-eye" aria-label="Toggle password visibility">
              <svg id="eyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnAdminLogin" class="btn-submit-admin">
          <span class="btn-text">LOGIN TO ADMIN PANEL</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <div class="card-footer">
        Standard user? <a href="login.html">Player Login</a>
      </div>
    </main>
  </div>

  <!-- ==========================================================================
       FIREBASE INTEGRATION SCRIPT
       ========================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      get 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ------------------------------------------------------------------------
    // FIREBASE CONFIGURATION
    // ------------------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCypPyOyk2gh42SS8z8bnK5emKQmr40v5U",
      authDomain: "game-with-fun-a1988.firebaseapp.com",
      databaseURL: "https://game-with-fun-a1988-default-rtdb.firebaseio.com",
      projectId: "game-with-fun-a1988",
      storageBucket: "game-with-fun-a1988.firebasestorage.app",
      messagingSenderId: "226037846599",
      appId: "1:226037846599:web:415dc67b9d06007646d762"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM References
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminIdInput = document.getElementById('adminIdInput');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const btnAdminLogin = document.getElementById('btnAdminLogin');
    const btnToggleEye = document.getElementById('btnToggleEye');
    const eyeSvg = document.getElementById('eyeSvg');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');

    // Password Toggle
    let isPasswordShown = false;
    btnToggleEye.addEventListener('click', () => {
      isPasswordShown = !isPasswordShown;
      adminPasswordInput.type = isPasswordShown ? 'text' : 'password';

      if (isPasswordShown) {
        eyeSvg.innerHTML = `
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        `;
      } else {
        eyeSvg.innerHTML = `
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    function showAlert(text) {
      alertMsg.textContent = text;
      alertBox.className = 'alert-banner danger';
      alertBox.style.display = 'flex';
    }

    function clearAlert() {
      alertBox.style.display = 'none';
    }

    // ------------------------------------------------------------------------
    // ADMIN LOGIN FORM SUBMISSION
    // ------------------------------------------------------------------------
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const adminId = adminIdInput.value.trim();
      const password = adminPasswordInput.value;

      if (!adminId) {
        showAlert('Please enter your Admin ID.');
        adminIdInput.focus();
        return;
      }

      if (!password) {
        showAlert('Please enter your password.');
        adminPasswordInput.focus();
        return;
      }

      // Internal Mapping: Maps the Admin ID to configured internal Firebase email
      const internalAdminEmail = `${adminId}@thegamewithfun.com`.toLowerCase();

      btnAdminLogin.disabled = true;
      btnAdminLogin.classList.add('loading');

      try {
        // Step 1: Authenticate with Firebase Authentication
        const userCredential = await signInWithEmailAndPassword(auth, internalAdminEmail, password);
        const user = userCredential.user;

        // Step 2: Authorize in Realtime Database (/adminUsers/{uid})
        const adminSnapshot = await get(ref(database, `adminUsers/${user.uid}`));

        if (adminSnapshot.exists()) {
          const adminProfile = adminSnapshot.val();
          if (adminProfile.role === 'admin' && adminProfile.active === true) {
            // Authorized -> Redirect to admin dashboard
            window.location.replace('admin.html');
            return;
          }
        }

        // If not registered in /adminUsers, reject session
        await signOut(auth);
        showAlert(`Access Denied: UID (${user.uid}) is not registered under /adminUsers with role: "admin" and active: true.`);
      } catch (err) {
        console.error('Admin Auth Error:', err);
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          showAlert('Invalid Admin ID or Password. Please check credentials.');
        } else if (err.code === 'auth/too-many-requests') {
          showAlert('Too many consecutive attempts. Please wait a moment.');
        } else if (err.code === 'auth/network-request-failed') {
          showAlert('Network error. Check your internet connection.');
        } else {
          showAlert('Unable to sign in. Verify Firebase Authentication setup.');
        }
      } finally {
        btnAdminLogin.disabled = false;
        btnAdminLogin.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
